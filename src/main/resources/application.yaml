logging:
  level:
    root: WARN
    com.technokratos.pact: INFO

server:
  port: 8080

minio:
  endpoint: ${MINIO_INTERNAL_URL:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_URL}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: default-bucket
  region: us-east-1
  secure: false
  allowed-extensions: jpg,jpeg,png,gif,mp4,pdf,doc,docx
  public-url-expiry: 604800

spring:
  application:
    name: Pact

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
    default-schema: public

  web:
    error:
      include-message: always
      include-binding-errors: always

steam:
  games:
    count: 100

external-api:
  steam-spy:
    url: https://steamspy.com/api.php?request=top100forever
  steam:
    base-app-url: https://store.steampowered.com/app/

openrouter:
  api:
    key: ${STEAM_API_KEY}
    url: https://openrouter.ai/api/v1/chat/completions

remember-me-key: ${REMEMBER_ME_KEY}