<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Регистрация в игровом сообществе Pact">
    <meta name="theme-color" content="#0a0c10">
    <title>Регистрация — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1 auth-container">
    <div class="container">
        <div class="auth-card card-glass p-4 p-md-5">
            <div class="auth-header">
                <i class="bi bi-person-plus-fill"></i>
                <h1>Создать аккаунт</h1>
                <p class="text-secondary-custom small">Присоединяйся к сообществу Pact</p>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/auth/register}" th:object="${user}" method="post" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold">Имя пользователя</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-subtle">
                            <i class="bi bi-at" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="text"
                               class="form-control bg-transparent border-subtle"
                               id="username"
                               name="username"
                               th:field="*{username}"
                               th:errorclass="is-invalid"
                               placeholder="username"
                               autocomplete="username"
                               required>
                    </div>
                    <div th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}"
                         class="invalid-feedback d-block small mt-1"></div>
                    <div th:unless="${#fields.hasErrors('username')}" class="form-text text-secondary-custom small">
                        Только латиница, цифры и символы . _ -
                    </div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label small fw-semibold">Отображаемое имя</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-subtle">
                            <i class="bi bi-person" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="text"
                               class="form-control bg-transparent border-subtle"
                               id="name"
                               name="name"
                               th:field="*{name}"
                               th:errorclass="is-invalid"
                               placeholder="Как вас называть?"
                               autocomplete="name"
                               required>
                    </div>
                    <div th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"
                         class="invalid-feedback d-block small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-subtle">
                            <i class="bi bi-envelope" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="email"
                               class="form-control bg-transparent border-subtle"
                               id="email"
                               name="email"
                               th:field="*{email}"
                               th:errorclass="is-invalid"
                               placeholder="your@email.com"
                               autocomplete="email"
                               required>
                    </div>
                    <div th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"
                         class="invalid-feedback d-block small mt-1"></div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-subtle">
                            <i class="bi bi-lock" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="password"
                               class="form-control bg-transparent border-subtle"
                               id="password"
                               name="password"
                               th:field="*{password}"
                               th:errorclass="is-invalid"
                               placeholder="Минимум 6 символов"
                               autocomplete="new-password"
                               required>
                        <button class="btn btn-outline-secondary border-subtle password-toggle" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"
                         class="invalid-feedback d-block small mt-1"></div>
                    <div class="form-text text-secondary-custom small">
                        Пароль должен содержать минимум 6 символов
                    </div>
                </div>

                <button type="submit" class="btn-solid-pact w-100 justify-content-center">
                    <i class="bi bi-check-lg"></i> Зарегистрироваться
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-secondary-custom small mb-0">
                    Уже есть аккаунт?
                    <a href="/auth/login" class="text-decoration-none" style="color: var(--accent-purple);">Войти</a>
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
