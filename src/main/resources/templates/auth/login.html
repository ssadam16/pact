<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Вход в игровое сообщество Pact">
    <meta name="theme-color" content="#0a0c10">
    <title>Вход — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 93,27.5 93,72.5 50,95 7,72.5 7,27.5' fill='%238b5cf6'/></svg>">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card-glass p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right fs-1" style="color: var(--accent-purple);"></i>
                        <h1 class="h3 mt-3 mb-2">Добро пожаловать</h1>
                        <p class="text-secondary-custom small">Войдите в свой аккаунт</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Неверное имя пользователя или пароль
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        Вы вышли из системы
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">Имя пользователя</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-subtle">
                                    <i class="bi bi-person" style="color: var(--accent-purple);"></i>
                                </span>
                                <input type="text"
                                       class="form-control bg-transparent border-subtle"
                                       id="username"
                                       name="username"
                                       placeholder="username"
                                       required autofocus
                                       autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold">Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-subtle">
                                    <i class="bi bi-lock" style="color: var(--accent-purple);"></i>
                                </span>
                                <input type="password"
                                       class="form-control bg-transparent border-subtle"
                                       id="password"
                                       name="password"
                                       placeholder="Ваш пароль"
                                       autocomplete="current-password"
                                       required>
                                <button class="btn btn-outline-secondary border-subtle" type="button" id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input bg-transparent border-subtle" id="remember-me" name="remember-me" value="true">
                            <label class="form-check-label small text-secondary-custom" for="remember-me">
                                Запомнить меня
                            </label>
                        </div>

                        <button type="submit" class="btn-solid-pact w-100 justify-content-center">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-secondary-custom small mb-0">
                            Нет аккаунта?
                            <a href="/auth/register" class="text-decoration-none" style="color: var(--accent-purple);">Зарегистрироваться</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
