<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чаты — Pact</title>
  <link rel="stylesheet" href="/css/main.css">
<!--  <link rel="stylesheet" href="/css/chat.css">-->
</head>
<body>
<div class="chat-layout">

  <!-- Sidebar -->
  <aside class="chat-sidebar">
    <div class="chat-sidebar-header">
      <h2>Чаты</h2>
    </div>
    <a href="/chat/new" class="new-chat-btn-sidebar">+ Новый чат</a>
    <div class="chats-list" id="chatsList">
      <div class="chat-spinner">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
      </div>
    </div>
  </aside>

  <!-- Welcome area -->
  <div class="chats-welcome">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <h2>Добро пожаловать!</h2>
    <p>Выберите чат слева или начните новый разговор</p>
    <a href="/chat/new" class="btn-solid-pact" style="margin-top:8px; font-size:14px;">
      Начать чат
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/chats.js"></script>
</body>
</html>
