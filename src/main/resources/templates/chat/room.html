<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат — Pact</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
<div class="chat-layout">

  <!-- Sidebar -->
  <aside class="chat-sidebar">
    <div class="chat-sidebar-header">
      <a href="/chat/list" class="chat-sidebar-back">← Все чаты</a>
      <a href="/chat/new" class="btn-outline-pact btn-sm" style="font-size:12px; padding: 5px 12px;">+ Новый</a>
    </div>
    <div class="chats-list" id="chatsList">
      <div class="chat-spinner">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <main class="chat-main">
    <div class="chat-topbar">
      <div class="chat-avatar" id="chatTopbarAvatar">?</div>
      <div class="chat-topbar-info">
        <div class="chat-topbar-name" id="chatTopbarName">...</div>
        <div class="chat-topbar-status" id="chatTopbarStatus"></div>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="typing-indicator" id="typingIndicator"></div>

    <div class="chat-input-area">
      <textarea class="chat-text-input" id="messageInput" rows="1"
                placeholder="Написать сообщение..." autocomplete="off"></textarea>
      <button class="chat-send-btn" id="sendBtn" title="Отправить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </main>
</div>

<script th:inline="javascript">
  window.__CHAT_ID__ = [[${chatId}]];
  window.__CURRENT_USERNAME__ = [[${username}]];
</script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/room.js"></script>
</body>
</html>
