<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 350px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .chats-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .chats-header h2 {
      font-size: 20px;
      cursor: pointer;
      color: #0088cc;
    }
    .chats-header h2:hover {
      text-decoration: underline;
    }
    .chats-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-item {
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-item:hover {
      background: #f8f8f8;
    }
    .chat-item.active {
      background: #e3f2fd;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0088cc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .chat-info {
      flex: 1;
    }
    .chat-name {
      font-weight: 600;
    }
    .last-message {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .unread-badge {
      background: #0088cc;
      color: white;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      padding: 0 5px;
    }
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fafafa;
    }
    .chat-header {
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 60%;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .message.outgoing {
      align-self: flex-end;
    }
    .message.incoming {
      align-self: flex-start;
    }
    .message-bubble {
      padding: 10px 12px;
      border-radius: 18px;
      word-wrap: break-word;
    }
    .outgoing .message-bubble {
      background: #0088cc;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .incoming .message-bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .message-meta {
      font-size: 11px;
      margin-top: 4px;
      padding: 0 8px;
      color: #999;
    }
    .input-area {
      padding: 15px 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }
    .message-input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #e0e0e0;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }
    .send-btn {
      padding: 10px 20px;
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .send-btn:hover {
      background: #006699;
    }
    .typing-indicator {
      font-size: 12px;
      color: #999;
      padding: 5px 20px;
      font-style: italic;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="chats-header">
    <h2 onclick="location.href='/chat/list'">← Чаты</h2>
  </div>
  <div class="chats-list" id="chatsList">
    <div class="loading">Загрузка...</div>
  </div>
</div>
<div class="chat-main">
  <div class="chat-header">
    <div class="avatar" id="chatAvatar">
      <span>?</span>
    </div>
    <div>
      <div style="font-weight: 600" id="chatName">Загрузка...</div>
      <div style="font-size: 12px; color: #666" id="chatStatus">онлайн</div>
    </div>
  </div>
  <div class="messages-area" id="messagesArea">
    <div class="loading">Загрузка сообщений...</div>
  </div>
  <div class="typing-indicator" id="typingIndicator" style="display: none;">Печатает...</div>
  <div class="input-area">
    <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">Отправить</button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
  const chatId = '[[${chatId}]]';  // <- ДОБАВЬ КАВЫЧКИ
  let stompClient = null;
  let currentPage = 0;
  let isLoading = false;
  let hasMore = true;
  let typingTimeout = null;
  let currentUsername = '[[${username}]]';  // <- И СЮДА КАВЫЧКИ

  // Функция отправки сообщения
  window.sendMessage = function() {
    const input = $('#messageInput');
    const content = input.val().trim();

    if (!content) {
      console.log('Message is empty');
      return;
    }

    if (!stompClient || !stompClient.connected) {
      console.error('WebSocket not connected');
      alert('Нет соединения с сервером');
      return;
    }

    const request = {
      chatId: chatId,
      content: content,
      replyToMessageId: null,
      mediaList: null
    };

    console.log('Sending message:', request);
    stompClient.send('/app/chat.send', {}, JSON.stringify(request));
    input.val('');
  };

  // WebSocket подключение
  function connectWebSocket() {
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
      console.log('Connected to WebSocket: ' + frame);

      // Подписка на сообщения в этом чате
      stompClient.subscribe(`/topic/chat.${chatId}`, function(message) {
        const msg = JSON.parse(message.body);
        console.log('Received message:', msg);
        const isOutgoing = msg.author?.username === currentUsername;
        appendMessage(msg, isOutgoing);
      });

      // Подписка на статус печатания
      stompClient.subscribe('/user/queue/typing', function(message) {
        const data = JSON.parse(message.body);
        console.log('Typing event:', data);
        if (data.chatId === chatId && data.isTyping) {
          showTypingIndicator();
        } else {
          hideTypingIndicator();
        }
      });

      // Подписка на прочтения
      stompClient.subscribe('/user/queue/read', function(message) {
        const data = JSON.parse(message.body);
        console.log('Read receipt:', data);
        if (data.chatId === chatId) {
          markMessagesAsReadLocal(data.readUpToMessageId);
        }
      });
    }, function(error) {
      console.error('WebSocket connection error:', error);
      setTimeout(connectWebSocket, 5000);
    });
  }

  function sendTyping(isTyping) {
    if (stompClient && stompClient.connected) {
      stompClient.send('/app/chat.typing', {}, JSON.stringify({
        chatId: chatId,
        isTyping: isTyping
      }));
    }
  }

  function showTypingIndicator() {
    $('#typingIndicator').show();
  }

  function hideTypingIndicator() {
    $('#typingIndicator').hide();
  }

  // Загрузка сообщений
  function loadMessages(page = 0) {
    if (isLoading) return;
    isLoading = true;

    $.ajax({
      url: `/api/chats/${chatId}/messages`,
      method: 'GET',
      data: { page: page },
      xhrFields: {
        withCredentials: true
      },
      success: function(response) {
        if (page === 0) {
          $('#messagesArea').empty();
        }

        if (response.content && response.content.length > 0) {
          response.content.reverse().forEach(msg => {
            const isOutgoing = msg.author?.username === currentUsername;
            prependMessage(msg, isOutgoing);
          });
          hasMore = !response.last;
        } else if (page === 0) {
          $('#messagesArea').html('<div class="loading">Нет сообщений</div>');
        }

        isLoading = false;
      },
      error: function(xhr) {
        console.error('Error loading messages:', xhr);
        isLoading = false;
      }
    });
  }

  function appendMessage(msg, isOutgoing) {
    const messageHtml = createMessageHtml(msg, isOutgoing);
    $('#messagesArea').append(messageHtml);
    scrollToBottom();

    // Отмечаем как прочитанное при просмотре
    if (!isOutgoing && stompClient && stompClient.connected) {
      stompClient.send('/app/chat.read', {}, JSON.stringify({
        chatId: chatId,
        messageId: msg.id
      }));
    }
  }

  function prependMessage(msg, isOutgoing) {
    const messageHtml = createMessageHtml(msg, isOutgoing);
    $('#messagesArea').prepend(messageHtml);
  }

  function createMessageHtml(msg, isOutgoing) {
    const time = new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const status = isOutgoing ? (msg.status === 'READ' ? '✓✓' : '✓') : '';
    const content = msg.content || '';

    return `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    <div class="message-bubble">${escapeHtml(content)}</div>
                    <div class="message-meta">
                        ${time} ${status}
                        ${msg.replyToMessage ? `<span style="margin-left: 8px;">↳ Ответ на: ${escapeHtml(msg.replyToMessage.content?.substring(0, 30))}</span>` : ''}
                    </div>
                </div>
            `;
  }

  function markMessagesAsReadLocal(messageId) {
    // Подсветить прочитанные сообщения
    $('.message.outgoing').each(function() {
      const meta = $(this).find('.message-meta');
      if (!meta.text().includes('✓✓')) {
        meta.html(meta.html().replace('✓', '✓✓'));
      }
    });
  }

  function scrollToBottom() {
    const area = $('#messagesArea');
    area.scrollTop(area[0].scrollHeight);
  }

  function loadChats() {
    $.ajax({
      url: '/api/chats',
      method: 'GET',
      data: { page: 0, size: 100 },
      xhrFields: {
        withCredentials: true
      },
      success: function(response) {
        $('#chatsList').empty();
        if (response.content && response.content.length > 0) {
          response.content.forEach(chat => {
            const isActive = chat.id === chatId;
            const avatarHtml = chat.interlocutor?.avatarUrl
                    ? `<img src="${chat.interlocutor.avatarUrl}">`
                    : `<span>${chat.interlocutor?.name?.charAt(0) || chat.interlocutor?.username?.charAt(0) || '?'}</span>`;

            const unreadHtml = chat.unreadCount > 0
                    ? `<div class="unread-badge">${chat.unreadCount}</div>`
                    : '';

            const chatHtml = `
                                <div class="chat-item ${isActive ? 'active' : ''}" onclick="location.href='/chat/${chat.id}'">
                                    <div class="avatar">${avatarHtml}</div>
                                    <div class="chat-info">
                                        <div class="chat-name">${escapeHtml(chat.interlocutor?.name || chat.interlocutor?.username || 'Пользователь')}</div>
                                        <div class="last-message">${escapeHtml(chat.lastMessage?.content || 'Нет сообщений')}</div>
                                    </div>
                                    ${unreadHtml}
                                </div>
                            `;
            $('#chatsList').append(chatHtml);
          });
        } else {
          $('#chatsList').html('<div class="loading">Нет чатов</div>');
        }
      },
      error: function(xhr) {
        console.error('Error loading chats:', xhr);
      }
    });
  }

  function loadChatInfo() {
    $.ajax({
      url: '/api/chats',
      method: 'GET',
      data: { page: 0, size: 100 },
      xhrFields: {
        withCredentials: true
      },
      success: function(response) {
        const chat = response.content?.find(c => c.id === chatId);
        if (chat && chat.interlocutor) {
          $('#chatName').text(chat.interlocutor.name || chat.interlocutor.username);
          if (chat.interlocutor.avatarUrl) {
            $('#chatAvatar').html(`<img src="${chat.interlocutor.avatarUrl}" alt="avatar">`);
          } else {
            $('#chatAvatar').html(`<span>${(chat.interlocutor.name || chat.interlocutor.username)?.charAt(0) || '?'}</span>`);
          }
        }
      },
      error: function(xhr) {
        console.error('Error loading chat info:', xhr);
      }
    });
  }

  function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // События ввода
  $('#messageInput').on('input', function() {
    clearTimeout(typingTimeout);
    sendTyping(true);
    typingTimeout = setTimeout(() => sendTyping(false), 1000);
  });

  $('#messageInput').on('keypress', function(e) {
    if (e.which === 13) {
      sendMessage();
    }
  });

  // Инициализация
  $(document).ready(function() {
    console.log('Page loaded, chatId:', chatId, 'currentUser:', currentUsername);
    loadChats();
    loadChatInfo();
    loadMessages(0);
    connectWebSocket();
  });
</script>
</body>
</html>
