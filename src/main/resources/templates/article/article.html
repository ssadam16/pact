<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" th:content="${article.title} + ' — статья в игровом сообществе Pact'">
    <meta name="theme-color" content="#0a0c10">
    <title th:text="${article.title} + ' — Pact'">Статья — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="mb-4">
                    <a href="/" class="text-decoration-none text-secondary-custom hover-lift d-inline-flex align-items-center gap-1">
                        <i class="bi bi-arrow-left"></i>
                        <span>На главную</span>
                    </a>
                </div>

                <article class="card-glass p-4 p-md-5">
                    <div class="article-header mb-4">
                        <div class="article-meta mb-3">
                            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                                <div class="d-flex align-items-center gap-2">
                                    <div th:if="${article.author.avatarUrl != null}" class="article-author-avatar-sm">
                                        <img th:src="@{${article.author.avatarUrl}}" alt="Avatar" class="rounded-circle" width="40" height="40" style="object-fit: cover;">
                                    </div>
                                    <div th:unless="${article.author.avatarUrl != null}" class="article-author-avatar-placeholder-sm">
                                        <span th:text="${#strings.substring(article.author.username, 0, 1)}">U</span>
                                    </div>
                                    <div>
                                        <a th:href="@{/user/{username}(username=${article.author.username})}"
                                           class="fw-semibold text-decoration-none hover-lift"
                                           th:text="${article.author.username}">
                                            username
                                        </a>
                                        <div class="small text-secondary-custom">
                                            <i class="bi bi-clock"></i>
                                            <span th:text="${#temporals.format(article.createdAt, 'dd MMMM yyyy')}">01 января 2024</span>
                                            <span th:if="${article.updatedAt != null && article.updatedAt != article.createdAt}"
                                                  class="ms-2">
                                                <i class="bi bi-pencil"></i>
                                                обновлено <span th:text="${#temporals.format(article.updatedAt, 'dd MMMM yyyy')}"></span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2" th:if="${!article.games.isEmpty()}">
                                <span class="tag d-inline-flex align-items-center gap-1" th:each="game : ${article.games}">
                                    <i class="bi bi-controller"></i>
                                    <span th:text="${game.name}">Game</span>
                                </span>
                            </div>
                        </div>

                        <h1 class="article-title" th:text="${article.title}">Название статьи</h1>
                    </div>

                    <div class="article-content" th:utext="${article.content}">
                        Содержание статьи
                    </div>
                </article>

                <div class="mt-4 text-center">
                    <a href="/" class="btn-outline-pact">
                        <i class="bi bi-house"></i> Вернуться на главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/article.js}"></script>
</body>
</html>
