<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" th:content="${article.title} + ' — статья в игровом сообществе Pact'">
    <meta name="theme-color" content="#0a0c10">
    <title th:text="${article.title} + ' — Pact'">Статья — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="mb-4">
                    <a href="/" class="text-decoration-none text-secondary-custom hover-lift d-inline-flex align-items-center gap-1">
                        <i class="bi bi-arrow-left"></i>
                        <span>На главную</span>
                    </a>
                </div>

                <article class="card-glass p-4 p-md-5">
                    <div class="article-header mb-4">
                        <div class="article-meta mb-3">
                            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
                                <div class="d-flex align-items-center gap-2">
                                    <img th:if="${article.author.avatarUrl != null and article.author.avatarUrl != ''}"
                                         th:src="@{${article.author.avatarUrl}}"
                                         alt="Avatar"
                                         class="rounded-circle"
                                         width="48"
                                         height="48"
                                         style="object-fit: cover;">
                                    <div th:unless="${article.author.avatarUrl != null and article.author.avatarUrl != ''}" class="friend-avatar-placeholder-sm">
                                        <span th:text="${#strings.substring(article.author.username, 0, 1)}">U</span>
                                    </div>
                                    <div>
                                        <a th:href="@{/user/{username}(username=${article.author.username})}"
                                           class="fw-semibold text-decoration-none hover-lift"
                                           th:text="${article.author.username}">
                                            username
                                        </a>
                                        <div class="small text-secondary-custom">
                                            <i class="bi bi-clock"></i>
                                            <span th:text="${#temporals.format(article.createdAt, 'dd MMMM yyyy')}">01 января 2024</span>
                                            <span th:if="${article.updatedAt != null && article.updatedAt != article.createdAt}"
                                                  class="ms-2">
                                                <i class="bi bi-pencil"></i>
                                                обновлено <span th:text="${#temporals.format(article.updatedAt, 'dd MMMM yyyy')}"></span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2 mb-3" th:if="${!article.games.isEmpty()}">
                                <span class="tag d-inline-flex align-items-center gap-1" th:each="game : ${article.games}">
                                    <i class="bi bi-controller"></i>
                                    <span th:text="${game.name}">Game</span>
                                </span>
                            </div>

                            <div class="d-flex flex-wrap gap-2" th:if="${!article.tags.isEmpty()}">
                                <span class="tag d-inline-flex align-items-center gap-1" th:each="tag : ${article.tags}">
                                    <i class="bi bi-tag-fill"></i>
                                    <span th:text="${tag.name}">Tag</span>
                                </span>
                            </div>
                        </div>

                        <h1 class="article-title" th:text="${article.title}">Название статьи</h1>
                    </div>

                    <div class="article-content" th:utext="${article.content}">
                        Содержание статьи
                    </div>

                    <div class="article-footer mt-4 pt-3 border-top border-subtle">
                        <div class="d-flex align-items-center gap-4">
                            <button class="btn-like-article" id="likeBtn" th:data-liked="${article.liked}">
                                <i th:class="${article.liked} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                <span id="likesCount" th:text="${article.likesCount}">0</span>
                            </button>
                            <button class="btn-comment-article" onclick="document.getElementById('commentInput').focus()">
                                <i class="bi bi-chat-dots-fill"></i>
                                <span id="commentsCountHeader" th:text="${article.commentsCount}">0</span>
                            </button>
                        </div>
                    </div>
                </article>

                <div class="comments-section mt-4" id="commentsSection">
                    <div class="card-glass p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="h5 mb-0">
                                <i class="bi bi-chat-dots-fill me-2" style="color: var(--accent-purple);"></i>
                                Комментарии
                                <span id="commentsCount" class="badge-role ms-2" th:text="${article.commentsCount}">0</span>
                            </h3>
                        </div>

                        <div class="comment-form mb-4">
                            <div class="d-flex gap-3">
                                <div class="flex-shrink-0">
                                    <div id="currentUserAvatar" class="comment-avatar-sm" style="display: none;"></div>
                                </div>
                                <div class="flex-grow-1">
                                    <textarea class="form-control bg-transparent border-subtle"
                                              id="commentInput"
                                              rows="3"
                                              placeholder="Напишите комментарий..."></textarea>
                                    <div class="d-flex justify-content-end mt-2">
                                        <button class="btn-solid-pact btn-sm" id="submitCommentBtn">
                                            <i class="bi bi-send-fill"></i> Отправить
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="commentsList" class="comments-list">
                            <div class="text-center py-4 text-secondary-custom" id="noCommentsPlaceholder">
                                <i class="bi bi-chat-dots fs-1"></i>
                                <p class="mt-2 mb-0">Пока нет комментариев</p>
                                <p class="small">Будьте первым, кто оставит комментарий!</p>
                            </div>
                        </div>

                        <div class="text-center mt-3" id="loadMoreContainer" style="display: none;">
                            <button class="btn-outline-pact btn-sm" id="loadMoreBtn">
                                <i class="bi bi-arrow-down"></i> Загрузить еще
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    window.articleId = /*[[${article.id}]]*/ null;
    window.currentUser = /*[[${#authentication != null && #authentication.name != 'anonymousUser'}]]*/ false;
    window.currentUsername = /*[[${#authentication != null && #authentication.name != 'anonymousUser'} ? ${#authentication.name} : null]]*/ null;
    window.currentUserAvatar = /*[[${session.authenticatedUserSessionInfo != null ? session.authenticatedUserSessionInfo.avatarUrl : null}]]*/ null;
    window.currentUserLetter = /*[[${session.authenticatedUserSessionInfo != null ? #strings.substring(session.authenticatedUserSessionInfo.username, 0, 1) : null}]]*/ null;
    window.isLiked = /*[[${article.liked}]]*/ false;
</script>
<script th:src="@{/js/article.js}"></script>
</body>
</html>
