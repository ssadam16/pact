<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Лента статей игрового сообщества Pact">
    <meta name="theme-color" content="#0a0c10">
    <title>Лента статей — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/article-line.css}" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1 py-4">
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="h2 mb-2">
                    <i class="bi bi-newspaper me-2" style="color: var(--accent-purple);"></i>
                    Лента статей
                </h1>
                <p class="text-secondary-custom">Свежие статьи от игроков со всего мира</p>
            </div>
        </div>

        <div class="mb-4">
            <div class="search-filter-bar">
                <div class="search-input-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchInput" class="form-control bg-transparent border-subtle" placeholder="Поиск по заголовку и содержанию...">
                </div>
                <div class="filter-actions">
                    <button class="btn-outline-pact-sm" id="filterToggleBtn">
                        <i class="bi bi-funnel-fill"></i> Фильтры
                    </button>
                    <div class="custom-select-wrapper">
                        <select id="sortSelect" class="custom-select">
                            <option value="createdAt,desc">📅 Новые сначала</option>
                            <option value="createdAt,asc">📅 Старые сначала</option>
                            <option value="likesCount,desc">❤️ По лайкам</option>
                            <option value="commentsCount,desc">💬 По комментариям</option>
                            <option value="logScore,desc">🔥 По популярности</option>
                        </select>
                    </div>
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" data-view="grid" title="Карточки">
                            <i class="bi bi-grid-3x3-gap-fill"></i>
                        </button>
                        <button class="view-toggle-btn" data-view="list" title="Список">
                            <i class="bi bi-list-ul"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="filtersPanel" class="filters-panel" style="display: none;">
                <div class="row align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-semibold small">Теги</label>
                        <div class="tags-filter" id="tagsFilter">
                            <div class="tags-list" th:each="tag : ${tags}">
                                <label class="tag-checkbox">
                                    <input type="checkbox" class="tag-checkbox-input" th:value="${tag.name}">
                                    <span class="tag-checkbox-label" th:text="${tag.name}">Tag</span>
                                </label>
                            </div>
                            <div th:if="${tags.isEmpty()}" class="text-secondary-custom small">Нет доступных тегов</div>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-semibold small">Игры</label>
                        <select id="gamesFilter" class="form-select bg-transparent border-subtle" multiple size="4">
                            <option th:each="game : ${games}" th:value="${game.name}" th:text="${game.name}"></option>
                        </select>
                        <div class="form-text text-secondary-custom small">Зажмите Ctrl для выбора нескольких игр</div>
                    </div>
                    <div class="col-md-2">
                        <div class="filter-buttons">
                            <button class="btn-outline-pact-sm" id="applyFiltersBtn">Применить</button>
                            <button class="btn-outline-pact-sm" id="resetFiltersBtn">Сбросить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="articlesContainer" class="articles-container"></div>

        <div id="loadingSpinner" class="text-center py-4" style="display: none;">
            <div class="chat-spinner">
                <div class="spinner-dot"></div>
                <div class="spinner-dot"></div>
                <div class="spinner-dot"></div>
            </div>
        </div>

        <div id="paginationContainer" class="pagination-wrapper mt-4"></div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    window.gamesData = /*[[${games}]]*/ [];
    window.tagsData = /*[[${tags}]]*/ [];
</script>
<script th:src="@{/js/article-line.js}"></script>
</body>
</html>
