<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SCP Foundation — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 93,27.5 93,72.5 50,95 7,72.5 7,27.5' fill='%238b5cf6'/></svg>">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1 scp-container">
    <div class="container">
        <div class="scp-card p-5 mx-auto">
            <div class="scp-glitch text-gradient mb-4">SCP-●●|●●●●●|●●|●</div>
            <i class="bi bi-shield-lock-fill fs-1" style="color: var(--accent-purple);"></i>
            <h2 class="mt-4 mb-3">Объект классифицирован</h2>
            <p class="text-secondary-custom mb-4">
                Доступ к данному материалу ограничен. <br>
                Ваш уровень допуска: <span class="text-gradient fw-bold">НЕДОСТАТОЧЕН</span>
            </p>
            <a href="/" class="btn-solid-pact"><i class="bi bi-arrow-left"></i> Вернуться в безопасную зону</a>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
