<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Управление друзьями в игровом сообществе Pact">
    <meta name="theme-color" content="#0a0c10">
    <title>Друзья — Pact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/friendship.css}" rel="stylesheet">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1 py-4">
    <div class="container">
        <div class="row">
            <div class="col-12 mb-4">
                <h1 class="h2 mb-2">
                    <i class="bi bi-people-fill me-2" style="color: var(--accent-purple);"></i>
                    Друзья
                </h1>
                <p class="text-secondary-custom">Находи новых друзей и общайся с ними</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card-glass p-4">
                    <h3 class="h5 mb-3">
                        <i class="bi bi-search me-2" style="color: var(--accent-purple);"></i>
                        Поиск пользователей
                    </h3>

                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text"
                                   class="form-control bg-transparent border-subtle"
                                   id="searchInput"
                                   placeholder="Введите имя пользователя..."
                                   autocomplete="off">
                            <button class="btn-solid-pact" type="button" id="searchBtn">
                                <i class="bi bi-search"></i> Найти
                            </button>
                        </div>
                    </div>

                    <div id="searchResults" class="search-results mt-3" style="display: none;">
                        <div class="fw-semibold mb-2 small text-secondary-custom">Результаты поиска:</div>
                        <div id="searchResultsList"></div>
                    </div>
                </div>

                <div class="card-glass p-4 mt-4">
                    <h3 class="h5 mb-3">
                        <i class="bi bi-envelope me-2" style="color: var(--accent-purple);"></i>
                        Заявки в друзья
                        <span id="requestsCount" class="badge-role ms-2" th:text="${#lists.size(friendshipRequests)}">0</span>
                    </h3>

                    <div id="requestsList">
                        <div th:if="${friendshipRequests.empty}" class="text-center py-4">
                            <i class="bi bi-inbox fs-1 text-secondary-custom"></i>
                            <p class="text-secondary-custom mt-2 mb-0">Нет входящих заявок</p>
                        </div>
                        <div th:each="request : ${friendshipRequests}" class="request-item d-flex align-items-center justify-content-between p-3 border-bottom border-subtle"
                             th:attr="data-request-id=${request.id}">
                            <div class="d-flex align-items-center gap-3">
                                <div class="friend-avatar-sm">
                                    <img th:if="${request.who.avatarUrl != null and request.who.avatarUrl != ''}"
                                         th:src="@{${request.who.avatarUrl}}"
                                         alt="Avatar"
                                         class="rounded-circle"
                                         width="48"
                                         height="48"
                                         style="object-fit: cover;">
                                    <div th:unless="${request.who.avatarUrl != null and request.who.avatarUrl != ''}" class="friend-avatar-placeholder-sm">
                                        <span th:text="${#strings.substring(request.who.username, 0, 1)}">U</span>
                                    </div>
                                </div>
                                <div>
                                    <a th:href="@{/user/{username}(username=${request.who.username})}"
                                       class="fw-semibold text-decoration-none hover-lift"
                                       th:text="${request.who.username}">
                                        username
                                    </a>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn-accept" th:attr="data-request-id=${request.id}">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                                <button class="btn-decline" th:attr="data-request-id=${request.id}">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card-glass p-4">
                    <h3 class="h5 mb-3">
                        <i class="bi bi-star-fill me-2" style="color: var(--accent-purple);"></i>
                        Мои друзья
                        <span id="friendsCount" class="badge-role ms-2" th:text="${#lists.size(friends)}">0</span>
                    </h3>

                    <div id="friendsList">
                        <div th:if="${friends.empty}" class="text-center py-5">
                            <i class="bi bi-people fs-1 text-secondary-custom"></i>
                            <p class="text-secondary-custom mt-2 mb-0">У вас пока нет друзей</p>
                            <p class="text-secondary-custom small">Найдите интересных людей через поиск</p>
                        </div>
                        <div class="row g-3" th:if="${!friends.empty}">
                            <div class="col-sm-6 col-md-4" th:each="friend : ${friends}" th:attr="data-friend-id=${friend.id}">
                                <div class="friend-card p-3 text-center">
                                    <div class="friend-avatar mb-2">
                                        <img th:if="${friend.avatarUrl != null and friend.avatarUrl != ''}"
                                             th:src="@{${friend.avatarUrl}}"
                                             alt="Avatar"
                                             class="rounded-circle"
                                             width="80"
                                             height="80"
                                             style="object-fit: cover;">
                                        <div th:unless="${friend.avatarUrl != null and friend.avatarUrl != ''}" class="friend-avatar-placeholder">
                                            <span th:text="${#strings.substring(friend.username, 0, 1)}">U</span>
                                        </div>
                                    </div>
                                    <a th:href="@{/user/{username}(username=${friend.username})}"
                                       class="fw-semibold text-decoration-none hover-lift d-block mt-2"
                                       th:text="${friend.username}">
                                        username
                                    </a>
                                    <button class="btn-remove-friend mt-2" th:attr="data-friend-id=${friend.id}">
                                        <i class="bi bi-person-dash-fill"></i> Удалить
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/friendship.js}"></script>
</body>
</html>
