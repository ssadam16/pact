<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-pact sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="/" id="logoLink">
      <i class="bi bi-hexagon-fill" style="color: #8b5cf6; font-size: 1.8rem;"></i>
      <span style="color: #edf2ff;">Pact</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item"><a class="nav-link nav-link-custom" href="/">Лента</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="/guides">Гайды</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="/articles">Статьи</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="/servers">Сервера</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="/marketplace">Маркетплейс</a></li>
      </ul>
      <div class="d-flex gap-2" th:switch="${isAuthenticated}">
        <div th:case="false">
          <a href="/auth/login" class="btn-outline-pact btn-sm">Вход</a>
          <a href="/auth/register" class="btn-solid-pact btn-sm">Присоединиться</a>
        </div>
        <div th:case="true">
          <div class="dropdown">
            <button class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="avatar-placeholder" th:text="${#strings.substring(userName, 0, 1)}">U</div>
              <span th:text="${userName}" class="text-white">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li><a class="dropdown-item" href="/profile"><i class="bi bi-person"></i> Профиль</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Выйти</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

</body>
</html>
