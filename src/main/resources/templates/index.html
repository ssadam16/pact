<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Pact — игровое сообщество с гайдами, статьями и серверами для общения. Присоединяйся к альянсу!">
    <meta name="theme-color" content="#0a0c10">
    <title>Pact — игровое сообщество | Гайды, сервера, статьи</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragment/header :: header}"></div>

<main class="flex-grow-1">
    <div class="pact-sphere" id="pactSphere">
        <div class="sphere-glow" id="dynamicGlow"></div>
        <div class="sphere-content container">
            <span class="pact-badge">
                <i class="bi bi-shield-check"></i>
                <span>Сообщество нового поколения</span>
            </span>
            <h1 class="display-4 fw-bold mb-3">Вступи в <span class="text-gradient">Pact</span><br>с игроками по всему миру</h1>
            <p class="fs-5 mb-4" style="color: var(--text-secondary); max-width: 620px;">
                Гайды от профи, актуальные сервера и место, где твой голос формирует мету.
            </p>
            <div class="d-flex flex-wrap gap-3">
                <a href="/article/line" class="btn-solid-pact"><i class="bi bi-compass"></i> Исследовать</a>
                <a href="/servers" class="btn-outline-pact"><i class="bi bi-server"></i> Найти сервер</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragment/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/index.js}"></script>
<script th:src="@{/js/egg.js}"></script>
</body>
</html>
